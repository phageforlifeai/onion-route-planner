# Render.com Blueprint – New + → Blueprint → pick this repo. Creates a web service with a
# persistent 1 GB disk (Starter plan). You will be asked to type the APP_PASSWORD.
services:
  - type: web
    name: onion-route-planner
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --threads 6 -t 180 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    disk:
      name: planner-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATA_DIR
        value: /data
      - key: APP_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
